<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Progress</title>
		<link rel="stylesheet" href="css/progress.css" />
		<link rel="stylesheet" href="css/app.css" />
	</head>
	<body>
		<main class="app">
			<section class="app__block">
				<div class="progress">
					<svg class="progress__svg" viewBox="0 0 100 100">
						<circle class="progress__track" cx="50" cy="50" r="45"></circle>
						<circle class="progress__arc" cx="50" cy="50" r="45"></circle>
					</svg>
				</div>
			</section>
		</main>
	</body>
</html>
